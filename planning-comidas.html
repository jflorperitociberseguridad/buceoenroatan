<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning de comidas | Organizador semanal</title>
  <meta name="description" content="App para planificar comidas semanales, organizar recetas y generar lista de compra automáticamente.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .meal-card { border-left: 4px solid #0ea5e9; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-gradient-to-r from-cyan-700 to-blue-700 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div>
        <h1 class="text-3xl font-extrabold">🗓️ Planning de comidas</h1>
        <p class="text-cyan-100">Organiza tu semana y genera la lista de compra automáticamente.</p>
      </div>
      <a href="index.html" class="inline-flex items-center justify-center rounded-full bg-white text-blue-700 font-bold px-5 py-2 hover:bg-cyan-50 transition">Volver al inicio</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    <section class="lg:col-span-1 bg-white rounded-2xl shadow p-5">
      <h2 class="text-xl font-bold mb-4">Añadir comida</h2>
      <form id="mealForm" class="space-y-4">
        <div>
          <label for="day" class="block text-sm font-semibold mb-1">Día</label>
          <select id="day" class="w-full border rounded-lg px-3 py-2" required>
            <option value="Lunes">Lunes</option>
            <option value="Martes">Martes</option>
            <option value="Miércoles">Miércoles</option>
            <option value="Jueves">Jueves</option>
            <option value="Viernes">Viernes</option>
            <option value="Sábado">Sábado</option>
            <option value="Domingo">Domingo</option>
          </select>
        </div>
        <div>
          <label for="mealType" class="block text-sm font-semibold mb-1">Tipo de comida</label>
          <select id="mealType" class="w-full border rounded-lg px-3 py-2" required>
            <option value="Desayuno">Desayuno</option>
            <option value="Almuerzo">Almuerzo</option>
            <option value="Cena">Cena</option>
            <option value="Merienda">Merienda</option>
          </select>
        </div>
        <div>
          <label for="mealName" class="block text-sm font-semibold mb-1">Nombre del plato</label>
          <input id="mealName" class="w-full border rounded-lg px-3 py-2" type="text" placeholder="Ej: Ensalada de quinoa" required>
        </div>
        <div>
          <label for="ingredients" class="block text-sm font-semibold mb-1">Ingredientes (separados por coma)</label>
          <textarea id="ingredients" class="w-full border rounded-lg px-3 py-2" rows="3" placeholder="Ej: quinoa, tomate, pepino, limón" required></textarea>
        </div>
        <div>
          <label for="notes" class="block text-sm font-semibold mb-1">Notas (opcional)</label>
          <input id="notes" class="w-full border rounded-lg px-3 py-2" type="text" placeholder="Ej: preparar el domingo por la tarde">
        </div>
        <button class="w-full bg-blue-600 text-white font-bold rounded-lg py-2.5 hover:bg-blue-700 transition" type="submit">Guardar comida</button>
      </form>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
        <button id="exportBtn" class="bg-emerald-600 text-white rounded-lg py-2 font-semibold hover:bg-emerald-700 transition">Exportar JSON</button>
        <button id="clearBtn" class="bg-rose-600 text-white rounded-lg py-2 font-semibold hover:bg-rose-700 transition">Limpiar semana</button>
      </div>
    </section>

    <section class="lg:col-span-2 space-y-6">
      <article class="bg-white rounded-2xl shadow p-5">
        <h2 class="text-xl font-bold mb-4">Tu semana</h2>
        <div id="weeklyPlan" class="grid md:grid-cols-2 gap-4"></div>
      </article>

      <article class="bg-white rounded-2xl shadow p-5">
        <h2 class="text-xl font-bold mb-4">Lista de compra automática</h2>
        <ul id="shoppingList" class="space-y-2 list-disc list-inside text-slate-700"></ul>
      </article>
    </section>
  </main>

  <script>
    const storageKey = 'meal-planner-data-v1';
    const daysOrder = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
    const form = document.getElementById('mealForm');
    const weeklyPlan = document.getElementById('weeklyPlan');
    const shoppingList = document.getElementById('shoppingList');
    const clearBtn = document.getElementById('clearBtn');
    const exportBtn = document.getElementById('exportBtn');

    let meals = [];

    const loadMeals = () => {
      const raw = localStorage.getItem(storageKey);
      meals = raw ? JSON.parse(raw) : [];
    };

    const saveMeals = () => {
      localStorage.setItem(storageKey, JSON.stringify(meals));
    };

    const mealTypeOrder = ['Desayuno', 'Almuerzo', 'Merienda', 'Cena'];

    const renderPlan = () => {
      weeklyPlan.innerHTML = '';
      daysOrder.forEach((day) => {
        const dayMeals = meals
          .filter((meal) => meal.day === day)
          .sort((a, b) => mealTypeOrder.indexOf(a.mealType) - mealTypeOrder.indexOf(b.mealType));

        const container = document.createElement('div');
        container.className = 'border rounded-xl p-4 bg-slate-50';
        container.innerHTML = `<h3 class="font-bold text-lg mb-3">${day}</h3>`;

        if (!dayMeals.length) {
          const empty = document.createElement('p');
          empty.className = 'text-slate-500 text-sm';
          empty.textContent = 'Sin comidas planificadas.';
          container.appendChild(empty);
        } else {
          dayMeals.forEach((meal) => {
            const card = document.createElement('div');
            card.className = 'meal-card bg-white rounded-lg p-3 mb-3 shadow-sm';
            const notes = meal.notes ? `<p class="text-xs text-slate-500 mt-1">📝 ${meal.notes}</p>` : '';
            card.innerHTML = `
              <div class="flex justify-between gap-3">
                <div>
                  <p class="text-xs font-semibold text-sky-700 uppercase">${meal.mealType}</p>
                  <p class="font-bold">${meal.mealName}</p>
                  <p class="text-sm text-slate-600">${meal.ingredients.join(', ')}</p>
                  ${notes}
                </div>
                <button data-id="${meal.id}" class="delete-btn text-rose-600 font-semibold hover:text-rose-800">Eliminar</button>
              </div>
            `;
            container.appendChild(card);
          });
        }

        weeklyPlan.appendChild(container);
      });
    };

    const renderShoppingList = () => {
      const ingredientMap = new Map();

      meals.forEach((meal) => {
        meal.ingredients.forEach((ingredient) => {
          const normalized = ingredient.trim().toLowerCase();
          if (!normalized) return;
          ingredientMap.set(normalized, (ingredientMap.get(normalized) || 0) + 1);
        });
      });

      shoppingList.innerHTML = '';

      if (!ingredientMap.size) {
        shoppingList.innerHTML = '<li>No hay ingredientes todavía.</li>';
        return;
      }

      Array.from(ingredientMap.entries())
        .sort((a, b) => a[0].localeCompare(b[0], 'es'))
        .forEach(([ingredient, count]) => {
          const item = document.createElement('li');
          item.textContent = `${ingredient} (${count})`;
          shoppingList.appendChild(item);
        });
    };

    const render = () => {
      renderPlan();
      renderShoppingList();
    };

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const mealName = document.getElementById('mealName').value.trim();
      const ingredientsRaw = document.getElementById('ingredients').value;
      const ingredients = ingredientsRaw.split(',').map((ing) => ing.trim()).filter(Boolean);

      if (!mealName || !ingredients.length) return;

      meals.push({
        id: crypto.randomUUID(),
        day: document.getElementById('day').value,
        mealType: document.getElementById('mealType').value,
        mealName,
        ingredients,
        notes: document.getElementById('notes').value.trim()
      });

      saveMeals();
      render();
      form.reset();
    });

    weeklyPlan.addEventListener('click', (event) => {
      const target = event.target;
      if (!target.classList.contains('delete-btn')) return;

      const id = target.dataset.id;
      meals = meals.filter((meal) => meal.id !== id);
      saveMeals();
      render();
    });

    clearBtn.addEventListener('click', () => {
      const shouldClear = confirm('¿Quieres borrar todo el planning de comidas?');
      if (!shouldClear) return;
      meals = [];
      saveMeals();
      render();
    });

    exportBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(meals, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'planning-comidas.json';
      link.click();
      URL.revokeObjectURL(url);
    });

    loadMeals();
    render();
  </script>
</body>
</html>
